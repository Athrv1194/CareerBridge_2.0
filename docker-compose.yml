name: careerbridge

# Every secret comes from a sibling .env file (gitignored via **/.env). Copy .env.example to .env
# first -- the ${VAR:?...} entries below abort `docker compose up` with a named error rather than
# starting a service with an empty password.
#
# Host port choices: PostgreSQL is published on 5434 and RabbitMQ on 5673 so this stack can run
# alongside the local PostgreSQL 5432 / RabbitMQ 5672 the services already use for `mvnw
# spring-boot:run`. Inside the compose network the containers still talk on the standard 5432/5672
# -- the host mapping is only for psql/mongosh from the host.

x-backend-defaults: &backend-defaults
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

# Shared Spring overrides for the five PostgreSQL + RabbitMQ services. Every key here is a scalar,
# which is what makes environment overriding safe: only list-valued properties suffer the
# first-source-wins binding described in api-gateway/src/main/resources/application.yml.
x-backend-env: &backend-env
  # No application-docker.yml exists, and none is needed -- a profile with no matching file is not
  # an error in Boot. This only has to be something other than "local", because application-local.yml
  # holds real credentials and is excluded from every image by .dockerignore.
  SPRING_PROFILES_ACTIVE: docker
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: 5672
  # NOT guest/guest, unlike the local dev defaults in every service's application.yml. RabbitMQ
  # restricts the built-in guest account to loopback connections, and inside the compose network
  # each service connects from its own container IP -- guest would be refused with ACCESS_REFUSED
  # on every consumer. loopback_users only ever lists guest, so any other username is unrestricted.
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-careerbridge}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
  # Creates the liveness/readiness health groups. They are NOT auto-enabled outside Kubernetes, and
  # the healthchecks below depend on them: plain /actuator/health aggregates every datastore and
  # returns 503 whenever RabbitMQ (or, for notification-service, Mongo Atlas) is briefly unreachable,
  # which would make Docker mark a perfectly serviceable container unhealthy.
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

services:

  postgres:
    # Pinned to 17: the postgres:18 official image relocated PGDATA, so the /var/lib/postgresql/data
    # volume mount below would silently stop persisting anything.
    image: postgres:17-alpine
    container_name: careerbridge-postgres
    restart: unless-stopped
    # max_connections raised from the image default of 100. Ten PostgreSQL-backed services now
    # share this instance, and none of them override HikariCP's default maximumPoolSize/minimumIdle
    # of 10 -- at steady state that is 100 connections with zero headroom for anything else,
    # including a diagnostic psql session. Found live: the 10th service (resume-service) tipped
    # actual usage into "sorry, too many clients already" within seconds of a fresh `up -d`, not
    # under any real load. 300 leaves headroom for the ten services' pools plus admin connections
    # with room to add more services before this needs revisiting.
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Maintenance database only. The five application databases are created by init.sql.
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only when the data directory is empty, i.e. on first boot or after
      # `docker compose down -v`. It is written to be re-runnable by hand regardless.
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # -d postgres, because pg_isready reports ready as soon as the server accepts connections;
      # naming a database makes it an actual connection attempt.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: careerbridge-rabbitmq
    restart: unless-stopped
    environment:
      # Applied only when the broker initialises its Mnesia database, i.e. on first boot. Changing
      # RABBITMQ_PASSWORD in .env later has no effect while the rabbitmq-data volume survives --
      # `docker compose down -v` or `rabbitmqctl change_password` are the two ways to move it.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-careerbridge}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "5673:5672"
      # Management UI on the standard port -- http://localhost:15672. This is where the end-to-end
      # event chain gets verified: careerbridge.exchange plus the four consumer queues should all
      # appear once the services are up.
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------------------------------------
  # Backend services. None of these publishes a host port, deliberately.
  #
  # api-gateway is the only component in CareerBridge that validates a JWT; all eleven services below
  # trust the X-User-Id header blindly and ten of them have no Spring Security on the classpath at
  # all. Publishing 8081-8092 to the host would bind them on 0.0.0.0 and let anyone act as any user
  # with a single `curl -H "X-User-Id: 1"` -- the exact constraint CLAUDE.md records for deployment.
  # They remain reachable from each other and from the gateway over the compose network by service
  # name. To debug one directly, prefer `docker compose exec <svc> wget -qO- localhost:<port>/...`
  # over adding a ports entry.
  # ---------------------------------------------------------------------------------------------

  auth-service:
    <<: *backend-defaults
    build: ./auth-service
    container_name: careerbridge-auth
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/careerbridge_auth
      # Signs the tokens api-gateway verifies. One JWT_SECRET feeds both containers; overriding it
      # for one and not the other fails every authenticated request with a signature error.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Boot 4 cold start plus ddl-auto against an empty schema. Too short a start_period here just
      # burns retries while Hibernate is still creating tables.
      start_period: 60s

  student-service:
    <<: *backend-defaults
    build: ./student-service
    container_name: careerbridge-student
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/careerbridge_student
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  assessment-service:
    <<: *backend-defaults
    build: ./assessment-service
    container_name: careerbridge-assessment
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/careerbridge_assessment
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Longest of the five: data.sql seeds 7 careers / 5 categories / 22 questions / 88 options on
      # every startup, after defer-datasource-initialization waits for ddl-auto.
      start_period: 90s

  recommendation-service:
    <<: *backend-defaults
    build: ./recommendation-service
    container_name: careerbridge-recommendation
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/careerbridge_recommendation
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8084/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  notification-service:
    <<: *backend-defaults
    build: ./notification-service
    container_name: careerbridge-notification
    environment:
      <<: *backend-env
      # Singular here, plural in the Mongo URI below -- both already committed that way on purpose.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/careerbridge_notification
      # MongoDB Atlas, no container: the URI embeds its own credentials. Required rather than
      # defaulted, because application.yml falls back to mongodb://localhost:27017 and inside this
      # container localhost is the container itself -- the driver connects lazily, so the service
      # would start clean and only fail when the first recommendation.generated event arrives.
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in .env}
      # application.yml reads ${MAIL_USERNAME} / ${MAIL_PASSWORD}; .env names them GMAIL_* to make it
      # obvious an App Password is required, not the account password. This is where they meet.
      MAIL_USERNAME: ${GMAIL_USERNAME:-}
      MAIL_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      # This service's only synchronous cross-service call (the invoice PDF fetch). No depends_on
      # needed: RestClient connects lazily, same as every other RestClient-based client in this
      # project -- a payment-service outage is handled fail-soft at the call site, not by ordering
      # container startup.
      PAYMENT_SERVICE_URL: http://payment-service:8093
      # Backs the "Set Password & Access Portal" link in the org admin invite email. Not a
      # compose-network hostname -- this URL is handed to the TPO's browser, so it must be
      # whatever origin actually serves the frontend for this deployment.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8085/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  organization-service:
    <<: *backend-defaults
    build: ./organization-service
    container_name: careerbridge-organization
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/careerbridge_organization
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8087/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  roadmap-service:
    <<: *backend-defaults
    build: ./roadmap-service
    container_name: careerbridge-roadmap
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/careerbridge_roadmap
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8088/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Longer than the other backends: RoadmapDataSeeder runs as a CommandLineRunner after ddl-auto
      # and writes 7 templates plus 47 milestones before the app reports ready on first boot.
      start_period: 90s

  prs-service:
    <<: *backend-defaults
    build: ./prs-service
    container_name: careerbridge-prs
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/careerbridge_prs
      # One of the two synchronous service-to-service calls in the stack (recruiter-service makes
      # the other two). application.yml defaults this to localhost:8082 so `mvnw spring-boot:run`
      # works on a host; inside the compose network the container name is what resolves.
      # student-service publishes no host port, which is fine -- this call never leaves the network.
      STUDENT_SERVICE_URL: http://student-service:8082
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8089/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Shorter than roadmap-service's 90s: no seeder here, every row is created by an event.
      start_period: 30s

  recruiter-service:
    <<: *backend-defaults
    build: ./recruiter-service
    container_name: careerbridge-recruiter
    # No ports entry, like every other backend service. api-gateway is the only component that
    # validates a JWT; this service trusts X-User-Id/X-User-Role blindly, so a published host port
    # would let anyone post jobs or read the candidate pool as any role.
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/careerbridge_recruiter
      # Two synchronous calls, both inside the compose network and neither through the gateway:
      # student-service for the public candidate pool, prs-service for candidate scores. Both
      # default to localhost in application.yml so `mvnw spring-boot:run` works on a host.
      STUDENT_SERVICE_URL: http://student-service:8082
      PRS_SERVICE_URL: http://prs-service:8089
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8090/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Same as prs-service: no seeder, every row comes from a controller call.
      start_period: 30s

  resume-service:
    <<: *backend-defaults
    build: ./resume-service
    container_name: careerbridge-resume
    # No ports entry, no named volume. The generated PDF lives in the student_resumes.pdf_content
    # bytea column, not on disk -- no RESUME_STORAGE_DIR, and no volume to lose on a container
    # replace. Survives restarts and multiple replicas for free, which a Docker named volume would
    # not once there is more than one replica.
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/careerbridge_resume
      # The one synchronous call, inside the compose network, never through the gateway.
      STUDENT_SERVICE_URL: http://student-service:8082
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8091/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Same as prs-service and recruiter-service: no seeder, every row comes from a controller call.
      start_period: 30s

  payment-service:
    <<: *backend-defaults
    build: ./payment-service
    container_name: careerbridge-payment
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/careerbridge_payment
      # Razorpay SANDBOX keys. The key id is public and is returned to the browser so Checkout.js
      # can open the modal; the secret signs and verifies and must never leave the server.
      # Use the rzp_test_ pair, never rzp_live_ -- there is nothing in this codebase that
      # distinguishes them, so the prefix is the only guard.
      #
      # Optional (${VAR:-}), not required, and that is a deliberate trade. A ${VAR:?} here would
      # abort `docker compose up` for the WHOLE fifteen-container stack for any teammate who has
      # not obtained sandbox keys, which is a far worse daily failure than the one it prevents.
      # RazorpayClient checks for a blank key before every outbound call and answers a clear 503
      # ("Payments are not configured yet") rather than sending an empty Authorization header, so an
      # unconfigured deployment degrades exactly one feature and says so.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8093/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      # 60s, not 90s. PlanDataSeeder writes four rows, which is nothing like roadmap-service's 7
      # templates plus 47 milestones; what dominates here is Boot 4 cold start plus ddl-auto against
      # an empty schema, which is the 60s bucket.
      start_period: 60s

  ai-coach-service:
    build: ./ai-coach-service
    container_name: careerbridge-ai-coach
    # Deliberately does NOT use the *backend-defaults or *backend-env anchors, unlike every service
    # above. This is the only backend service with neither PostgreSQL nor RabbitMQ on its classpath:
    # *backend-defaults would add depends_on edges to two containers it never touches (delaying
    # startup and the gateway behind it), and *backend-env would set SPRING_DATASOURCE_* and
    # SPRING_RABBITMQ_* properties that have no binder here at all.
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      # Same Atlas cluster and same secret as notification-service, redirected to its own database
      # by SPRING_MONGODB_DATABASE rather than a second connection string. Required, not defaulted,
      # for the same reason as notification-service: application.yml falls back to
      # mongodb://localhost:27017 and inside this container localhost is the container itself.
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in .env}
      MONGODB_DATABASE: careerbridge_ai_coach
      # Three synchronous calls, all inside the compose network and none through the gateway:
      # roadmap-service for the student's career and milestone titles (and, for the admin refresh,
      # all 47 template titles in one call), student-service and prs-service for coaching context.
      # All three default to localhost in application.yml so `mvnw spring-boot:run` works on a host.
      ROADMAP_SERVICE_URL: http://roadmap-service:8088
      STUDENT_SERVICE_URL: http://student-service:8082
      PRS_SERVICE_URL: http://prs-service:8089
      # Optional, unlike every other secret in this file. Every client checks the key is non-blank
      # before calling out, so an unset key degrades one feature rather than failing startup --
      # see .env.example. A ${VAR:?} here would block `docker compose up` for anyone without keys.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8092/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Same as prs-service and resume-service: no seeder, no ddl-auto. The 47-milestone catalog is
      # populated by an admin POST, never at startup.
      start_period: 30s

  mentor-service:
    <<: *backend-defaults
    build: ./mentor-service
    container_name: careerbridge-mentor
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/careerbridge_mentor
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8094/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      # 60s, matching payment-service: no seeder, but Boot 4 cold start plus ddl-auto against an
      # empty schema is the 60s bucket rather than the 30s one.
      start_period: 60s

  api-gateway:
    build: ./api-gateway
    container_name: careerbridge-gateway
    restart: unless-stopped
    ports:
      # The only port published to the host. VITE_API_BASE_URL points here.
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      # Verifies what auth-service signs -- same value, same .env key.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Resolve the ${..._SERVICE_URI} placeholders in the gateway's route block. Read the comment
      # above `server: webmvc: routes:` in api-gateway/src/main/resources/application.yml before
      # replacing these with SPRING_CLOUD_GATEWAY_SERVER_WEBMVC_ROUTES_n_URI -- that form drops
      # every predicate in the list.
      AUTH_SERVICE_URI: http://auth-service:8081
      STUDENT_SERVICE_URI: http://student-service:8082
      ASSESSMENT_SERVICE_URI: http://assessment-service:8083
      RECOMMENDATION_SERVICE_URI: http://recommendation-service:8084
      NOTIFICATION_SERVICE_URI: http://notification-service:8085
      ORG_SERVICE_URI: http://organization-service:8087
      ROADMAP_SERVICE_URI: http://roadmap-service:8088
      PRS_SERVICE_URI: http://prs-service:8089
      RECRUITER_SERVICE_URI: http://recruiter-service:8090
      RESUME_SERVICE_URI: http://resume-service:8091
      AI_COACH_SERVICE_URI: http://ai-coach-service:8092
      PAYMENT_SERVICE_URI: http://payment-service:8093
      MENTOR_SERVICE_URI: http://mentor-service:8094
    # postgres and rabbitmq are covered transitively -- the gateway has neither a JDBC driver nor
    # spring-boot-starter-amqp on its classpath, so waiting on them directly would only add edges.
    depends_on:
      auth-service:
        condition: service_healthy
      student-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
      recommendation-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      organization-service:
        condition: service_healthy
      roadmap-service:
        condition: service_healthy
      prs-service:
        condition: service_healthy
      recruiter-service:
        condition: service_healthy
      resume-service:
        condition: service_healthy
      ai-coach-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      mentor-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./careerbridge-frontend
      args:
        # Browser-side value -- the container that serves these static files is never itself the
        # caller, so this stays localhost:8080 (the gateway's published host port) even though
        # frontend and api-gateway are sibling containers on the same compose network.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    container_name: careerbridge-frontend
    restart: unless-stopped
    ports:
      # Published on the plain HTTP port so visitors hit the site with no port number in the URL
      # (http://<host>/ instead of http://<host>:5173/). Locally this would collide with anything
      # already bound to host port 80, which is why local dev still used 5173 -- an EC2 instance
      # has nothing else claiming 80.
      - "80:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
  rabbitmq-data:
