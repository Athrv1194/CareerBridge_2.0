server:
  port: 8085

spring:
  application:
    name: notification-service
  profiles:
    # Defaults to the gitignored application-local.yml; AWS sets SPRING_PROFILES_ACTIVE=prod.
    # Without this block application-local.yml is never loaded at all.
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    # PostgreSQL has no createDatabaseIfNotExist equivalent -- the database must already exist
    # (CREATE DATABASE careerbridge_notification;).
    # Singular here, plural for Mongo below: deliberate. This matches careerbridge_auth/_student/
    # _assessment/_recommendation, while the Mongo database name was already committed as plural.
    url: jdbc:postgresql://localhost:5432/careerbridge_notification
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  mongodb:
    # spring.mongodb.uri, NOT spring.data.mongodb.uri. Boot 4 moved the driver-level connection
    # settings out of spring.data.mongodb.* into spring.mongodb.*; the old name is deprecated at
    # level "error" since 4.0.0, which means Boot does not bind it AND does not warn -- the driver
    # silently falls back to localhost:27017/test. See ai_incident_log.md (2026-07-27).
    # spring.data.mongodb.* still exists, but only for Spring-Data-level settings such as
    # auto-index-creation and field-naming-strategy.
    #
    # Local default only. The real deployment uses MongoDB Atlas, whose URI embeds credentials
    # and therefore lives solely in the gitignored application-local.yml.
    uri: ${MONGODB_URI:mongodb://localhost:27017/careerbridge_notifications}
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  mail:
    # spring.mail.host is what activates MailSenderAutoConfiguration -- without it there is no
    # JavaMailSender bean at all and EmailService's constructor injection fails the context.
    host: smtp.gmail.com
    port: 587
    # Empty defaults so the context always starts; the real values come from
    # application-local.yml (or MAIL_USERNAME / MAIL_PASSWORD in a deployed environment).
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # JavaMail has NO default timeouts. SMTP runs on the @RabbitListener thread and the
          # container defaults to concurrency 1, so a single hung Gmail connection would stall
          # every subsequent notification indefinitely.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  health:
    mail:
      # MailHealthIndicator opens a real SMTP connection to Gmail on every health poll. An ALB
      # polling every 10s would mean ~8,600 handshakes a day and near-certain throttling.
      enabled: false
    # NOT management.health.mongo.enabled -- Boot 4 renamed the module (spring-boot-mongodb,
    # spring.mongodb.uri) and the health indicator's @ConditionalOnEnabledHealthIndicator id moved
    # with it, from "mongo" to "mongodb". "mongo" silently matches nothing and leaves the indicator
    # running. Verified against the id string compiled into
    # MongoHealthContributorAutoConfiguration.class in spring-boot-mongodb-4.1.0.jar.
    mongodb:
      enabled: false

# This service's only synchronous cross-service dependency, added for the invoice PDF fetch.
# localhost by default so `mvnw spring-boot:run` works on a developer machine; docker-compose
# overrides PAYMENT_SERVICE_URL to http://payment-service:8093, the compose-network hostname.
# Connect and read timeouts are set in code (RestClientConfig), not here -- RestClient has no
# Boot-level timeout properties the way spring.mail.* does.
payment:
  service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8093}

# Backs the "Set Password & Access Portal" link in the org admin invite email. Vite's dev port by
# default; docker-compose and any real deployment override FRONTEND_URL to the actual origin.
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
