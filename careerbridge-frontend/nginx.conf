server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router owns every client-side route -- an unknown path (e.g. a hard refresh on
    # /roadmap) must still serve index.html rather than nginx's own 404, or the SPA never
    # gets a chance to load and render that route itself.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
