server:
  port: 8087

spring:
  application:
    name: organization-service
  profiles:
    # Defaults to the gitignored application-local.yml; docker-compose sets SPRING_PROFILES_ACTIVE=docker.
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    # PostgreSQL has no createDatabaseIfNotExist equivalent -- the database must already exist
    # (CREATE DATABASE careerbridge_organization;). docker/init.sql creates it for the compose stack.
    url: jdbc:postgresql://localhost:5432/careerbridge_organization
    username: postgres
    # Defaulted rather than bare ${DB_PASSWORD}: an unresolvable placeholder fails startup outright,
    # which would break `mvnw spring-boot:run` for anyone who has not exported the variable. The real
    # value comes from the gitignored application-local.yml, or SPRING_DATASOURCE_PASSWORD in Docker.
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
