server:
  port: 8081

spring:
  application:
    name: auth-service
  profiles:
    # Defaults to the gitignored application-local.yml; AWS sets SPRING_PROFILES_ACTIVE=prod.
    active: ${SPRING_PROFILES_ACTIVE:local}
  autoconfigure:
    # No formLogin/httpBasic here, so Boot's generated in-memory user is unreachable
    # dead weight -- excluded to stop it logging a fake "generated security password".
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    # createDatabaseIfNotExist: ddl-auto builds tables but never the schema itself,
    # so a fresh clone would otherwise fail with "Unknown database".
    url: jdbc:mysql://localhost:3306/careerbridge_auth?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-change-in-production}
  access-token-expiry: 900000
  refresh-token-expiry: 604800000
