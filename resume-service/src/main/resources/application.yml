server:
  # 8091. 8086 is unused and not a gap -- organization/roadmap/prs/recruiter took 8087-8090.
  port: 8091

spring:
  application:
    name: resume-service
  profiles:
    # Defaults to the gitignored application-local.yml; docker-compose sets SPRING_PROFILES_ACTIVE=docker.
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    # PostgreSQL has no createDatabaseIfNotExist equivalent -- the database must already exist
    # (CREATE DATABASE careerbridge_resume;). docker/init.sql creates it for the compose stack,
    # but only on a FRESH postgres volume; an existing one needs the CREATE DATABASE run by hand.
    url: jdbc:postgresql://localhost:5432/careerbridge_resume
    username: postgres
    # Defaulted rather than bare ${DB_PASSWORD}: an unresolvable placeholder fails startup outright,
    # which would break `mvnw spring-boot:run` for anyone who has not exported the variable. The
    # real value comes from the gitignored application-local.yml, or SPRING_DATASOURCE_PASSWORD in
    # Docker.
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    # No defer-datasource-initialization here, deliberately. This service has no data.sql or
    # schema.sql -- every row comes from a controller call. Setting it would be inert.

  # No spring.autoconfigure.exclude. auth-service excludes UserDetailsServiceAutoConfiguration
  # because it carries the security starter; with no security on this classpath that class does not
  # exist, and naming an absent class here fails startup outright.

# The one synchronous cross-service dependency. localhost by default so `mvnw spring-boot:run` works
# on a developer machine; docker-compose overrides it to the compose-network hostname. A Docker-only
# default would make every profile fetch fail with UnknownHostException outside Docker.
# Connect and read timeouts are set in code (RestClientConfig), not here -- RestClient has no
# Boot-level timeout properties the way spring.mail.* does.
student:
  service:
    url: ${STUDENT_SERVICE_URL:http://localhost:8082}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  # No management.health.rabbit.enabled entry: the RabbitMQ indicator is enabled by default, so
  # writing `true` would be inert. Note /actuator/health does aggregate RabbitMQ and returns 503
  # while the broker is down; healthchecks and the ALB must point at /actuator/health/liveness.
