server:
  port: 8084

spring:
  application:
    name: recommendation-service
  profiles:
    # Defaults to the gitignored application-local.yml; AWS sets SPRING_PROFILES_ACTIVE=prod.
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    # PostgreSQL has no createDatabaseIfNotExist equivalent -- the database must already exist
    # (CREATE DATABASE careerbridge_recommendation;), unlike the MySQL JDBC URL flag this replaced.
    url: jdbc:postgresql://localhost:5432/careerbridge_recommendation
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
