server:
  port: 8084

spring:
  application:
    name: recommendation-service
  profiles:
    # Defaults to the gitignored application-local.yml; AWS sets SPRING_PROFILES_ACTIVE=prod.
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    # createDatabaseIfNotExist: ddl-auto builds tables but never the schema itself,
    # so a fresh clone would otherwise fail with "Unknown database".
    url: jdbc:mysql://localhost:3306/careerbridge_recommendation?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
