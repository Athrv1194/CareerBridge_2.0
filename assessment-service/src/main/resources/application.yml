server:
  port: 8083

spring:
  application:
    name: assessment-service
  profiles:
    # Defaults to the gitignored application-local.yml; AWS sets SPRING_PROFILES_ACTIVE=prod.
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    # createDatabaseIfNotExist: ddl-auto builds tables but never the schema itself,
    # so a fresh clone would otherwise fail with "Unknown database".
    url: jdbc:mysql://localhost:3306/careerbridge_assessment?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  sql:
    init:
      # data.sql is idempotent (INSERT IGNORE against unique keys), so re-running it every
      # startup is safe. "embedded", the default, would skip it entirely on MySQL.
      mode: always
  jpa:
    # Boot property, NOT a Hibernate one -- it must sit here and not under
    # jpa.properties.hibernate, where Hibernate would ignore it and data.sql would run
    # before ddl-auto creates the tables ("Table doesn't exist").
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
