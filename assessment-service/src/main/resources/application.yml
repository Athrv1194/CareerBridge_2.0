server:
  port: 8083

spring:
  application:
    name: assessment-service
  datasource:
    url: jdbc:mysql://localhost:3306/careerbridge_assessment
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
